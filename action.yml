name: 'tofu-plan'
description: 'Detect changed tofu workspaces, run tofu plan for each, post idempotent PR comments'
author: 'darren-iac'
branding:
  icon: 'file-text'
  color: 'purple'

inputs:
  tofu-root:
    description: 'Root directory containing tofu workspaces (relative to repo root). Trailing slash optional.'
    required: false
    default: 'tofu/'
  tofu-version:
    description: 'OpenTofu version to install (passed to opentofu/setup-opentofu).'
    required: false
    default: 'latest'
  workspaces:
    description: 'Comma-separated list of workspaces to plan, overriding auto-detection. Useful when you want to force-plan a specific workspace.'
    required: false
    default: ''
  github-token:
    description: 'Token used to post PR comments. Defaults to github.token (the workflow token, which needs `pull-requests: write`).'
    required: false
    default: ${{ github.token }}

outputs:
  workspaces:
    description: 'Newline-separated list of workspaces that were planned'
    value: ${{ steps.detect.outputs.workspaces }}
  failed:
    description: 'true if any workspace plan exited with an unrecoverable error (i.e. not 0 or 2)'
    value: ${{ steps.run.outputs.failed }}

runs:
  using: 'composite'
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
      with:
        tofu_version: ${{ inputs.tofu-version }}
        tofu_wrapper: false

    - name: Detect changed workspaces
      id: detect
      shell: bash
      env:
        TOFU_ROOT: ${{ inputs.tofu-root }}
        EXPLICIT: ${{ inputs.workspaces }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        ROOT="${TOFU_ROOT%/}"

        if [ -n "$EXPLICIT" ]; then
          WS=$(echo "$EXPLICIT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sort -u | grep -v '^$' || true)
        elif [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
          # For each changed file under tofu-root, walk up the directory
          # tree looking for backend.tf — that's the workspace root.
          # Workspace identifier is the path relative to tofu-root, e.g.:
          #   tofu/coder/main.tf                    → coder
          #   tofu/slack/sleepless_agent/main.tf    → slack/sleepless_agent
          # This handles arbitrarily-nested workspace layouts. Files
          # whose parent chain has no backend.tf (e.g. modules under a
          # workspace's sub-dir) are silently ignored — they don't
          # define their own workspace.
          WS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$ROOT/" \
            | while IFS= read -r f; do
                d=$(dirname "$f")
                while [ "$d" != "." ] && [ "$d" != "/" ] && [ "$d" != "$ROOT" ]; do
                  if [ -f "$d/backend.tf" ]; then
                    echo "${d#${ROOT}/}"
                    break
                  fi
                  d=$(dirname "$d")
                done
              done \
            | sort -u)
        else
          echo "::warning::Not running on a pull_request event and no explicit `workspaces` input — nothing to plan."
          WS=""
        fi

        echo "Workspaces to plan:"
        if [ -n "$WS" ]; then
          echo "$WS" | sed 's/^/  /'
        else
          echo "  (none)"
        fi

        {
          echo 'workspaces<<EOF_WS_OUT'
          echo "$WS"
          echo 'EOF_WS_OUT'
        } >> "$GITHUB_OUTPUT"

    - name: Plan + comment per workspace
      id: run
      env:
        WORKSPACES: ${{ steps.detect.outputs.workspaces }}
        TOFU_ROOT: ${{ inputs.tofu-root }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Override GHA's default `bash -e -o pipefail` — we explicitly want
      # `tofu plan` to be able to exit non-zero (changes detected = exit 2,
      # plan errors = exit 1) without killing the loop before it can post
      # the comment. Setting flags via shell: rather than `set +e` inside
      # the script because GHA injects -e in the shell invocation itself,
      # before any of our `set` commands run.
      shell: 'bash --noprofile --norc -uo pipefail {0}'
      run: |
        # -e is OFF (see shell: above) — we keep iterating per-workspace.
        ROOT="${TOFU_ROOT%/}"
        FAILED_OVERALL=0

        if [ -z "$WORKSPACES" ]; then
          echo "No workspaces to plan."
          echo "failed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "${PR:-}" ]; then
          echo "::error::Action expects to run on a pull_request event (no github.event.pull_request.number)."
          echo "failed=true" >> "$GITHUB_OUTPUT"
          exit 1
        fi

        while IFS= read -r WS; do
          [ -z "$WS" ] && continue
          echo "::group::tofu plan: $WS"

          DIR="$ROOT/$WS"
          if [ ! -d "$DIR" ]; then
            echo "::warning::workspace dir not found: $DIR — skipping"
            echo "::endgroup::"
            continue
          fi

          (
            cd "$DIR"

            STATUS=0
            # `-lock=false` on both init and plan: PR-time plans are
            # read-only, multiple concurrent plans on different PRs are
            # safe, and skipping the lock means the action can run
            # without DynamoDB perms (S3 read on the state bucket is
            # enough for plan).
            if ! tofu init -input=false -no-color -lock=false 2>&1 | tee /tmp/init.txt; then
              STATUS=255
              cp /tmp/init.txt /tmp/plan.txt
              echo "[init failed — see init output above]" >> /tmp/plan.txt
            else
              tofu plan -no-color -detailed-exitcode -input=false -lock=false 2>&1 | tee /tmp/plan.txt
              STATUS=${PIPESTATUS[0]}
            fi

            tail -c 58000 /tmp/plan.txt > /tmp/plan-trimmed.txt 2>/dev/null || echo "(no plan output)" > /tmp/plan-trimmed.txt
            ORIG=$(wc -c < /tmp/plan.txt 2>/dev/null || echo 0)
            TRIM=$(wc -c < /tmp/plan-trimmed.txt 2>/dev/null || echo 0)

            if [ "$TRIM" -lt "$ORIG" ]; then
              { echo "(plan output trimmed: showing last $TRIM of $ORIG bytes)"; echo "..."; cat /tmp/plan-trimmed.txt; } > /tmp/plan-final.txt
            else
              cp /tmp/plan-trimmed.txt /tmp/plan-final.txt
            fi

            case "$STATUS" in
              0) EMOJI="✅"; SUMMARY="No changes" ;;
              2) EMOJI="📝"; SUMMARY="Changes detected" ;;
              *) EMOJI="❌"; SUMMARY="Plan failed (exit $STATUS)" ;;
            esac

            MARKER="<!-- tofu-plan-action: $WS -->"
            # Build the comment body without a heredoc — heredoc closing
            # delimiters must be at column 0 in bash, which doesn't work
            # cleanly inside the YAML-indented `run:` script. Plain
            # multi-line string is robust.
            PLAN_OUTPUT=$(cat /tmp/plan-final.txt)
            BODY="$MARKER
        ### $EMOJI \`tofu plan\` — \`$WS\` — $SUMMARY

        <details><summary>Plan output</summary>

        \`\`\`hcl
        $PLAN_OUTPUT
        \`\`\`

        </details>

        <sub>Posted by [tofu-plan-action](https://github.com/darren-iac/tofu-plan-action) for commit \`$HEAD_SHA\`.</sub>"

            # Use curl + python3 (universally available on GHA runners
            # incl. ARC images) instead of gh CLI which isn't installed
            # by default on minimal ARC runner images.
            BODY_JSON=$(python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<< "$BODY")

            EXISTING=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR/comments?per_page=100" \
              | python3 -c "
            import json, sys
            comments = json.load(sys.stdin)
            for c in comments:
                if '$MARKER' in c.get('body',''):
                    print(c['id'])
                    break
            " 2>/dev/null | head -1 || echo "")

            if [ -n "$EXISTING" ]; then
              curl -fsS -X PATCH \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$REPO/issues/comments/$EXISTING" \
                -d "$BODY_JSON" >/dev/null
              echo "Updated comment $EXISTING for workspace $WS"
            else
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$REPO/issues/$PR/comments" \
                -d "$BODY_JSON" >/dev/null
              echo "Posted new comment for workspace $WS"
            fi

            exit "$STATUS"
          )
          SUBSHELL_STATUS=$?

          # Treat 0 (no changes) and 2 (changes detected) as success.
          # Anything else is a real plan failure.
          if [ "$SUBSHELL_STATUS" != "0" ] && [ "$SUBSHELL_STATUS" != "2" ]; then
            echo "::error::workspace $WS: tofu plan failed (exit $SUBSHELL_STATUS)"
            FAILED_OVERALL=1
          fi

          echo "::endgroup::"
        done <<< "$WORKSPACES"

        if [ "$FAILED_OVERALL" = "1" ]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          exit 1
        else
          echo "failed=false" >> "$GITHUB_OUTPUT"
        fi
